<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قنوات beIN Sports - البث المباشر</title>
    <!-- رابط أيقونات Font Awesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0c2461, #1e3799);
            color: #fff;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 30px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #ffdd59;
        }
        
        .subtitle {
            font-size: 1.2rem;
            color: #ccc;
            margin-bottom: 20px;
        }
        
        /* زر التلكرام */
        .telegram-btn {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: linear-gradient(135deg, #ffdd59, #ffa502);
            color: #0c2461;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(255, 221, 89, 0.3);
            transition: all 0.3s ease;
            border: 2px solid #ffdd59;
        }
        
        .telegram-btn:hover {
            transform: translateY(-50%) scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 221, 89, 0.5);
            background: linear-gradient(135deg, #ffa502, #ffdd59);
        }
        
        .telegram-btn i {
            font-size: 1.4rem;
        }
        
        .logo {
            width: 120px;
            margin-bottom: 15px;
        }
        
        .main-content {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
        }
        
        .player-section {
            flex: 2;
            min-width: 300px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }
        
        .channels-section {
            flex: 1;
            min-width: 300px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }
        
        .section-title {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #ffdd59;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }
        
        #video-player {
            width: 100%;
            height: 400px;
            background-color: #000;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        
        .channel-info {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            text-align: center;
        }
        
        .channel-name {
            font-size: 1.4rem;
            color: #4bcffa;
            margin-bottom: 5px;
        }
        
        .channel-status {
            font-size: 0.9rem;
            color: #aaa;
        }
        
        .status-live {
            color: #ff6b6b;
            font-weight: bold;
        }
        
        .channels-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 600px;
            overflow-y: auto;
            padding-right: 10px;
        }
        
        .channel-btn {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #fff;
            text-align: right;
            width: 100%;
        }
        
        .channel-btn:hover {
            background: rgba(255, 221, 89, 0.2);
            transform: translateY(-3px);
        }
        
        .channel-btn.active {
            background: rgba(255, 221, 89, 0.3);
            border-right: 4px solid #ffdd59;
        }
        
        .channel-logo {
            width: 50px;
            height: 50px;
            margin-left: 15px;
            border-radius: 8px;
            object-fit: contain;
            background-color: #fff;
            padding: 5px;
        }
        
        .channel-title {
            font-size: 1.2rem;
            font-weight: 600;
        }
        
        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .control-btn {
            padding: 10px 20px;
            background: #1e3799;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
            flex-grow: 1;
            text-align: center;
        }
        
        .control-btn:hover {
            background: #0c2461;
        }
        
        footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: #aaa;
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            #video-player {
                height: 300px;
            }
            
            /* تعديل زر التلكرام للشاشات الصغيرة */
            .telegram-btn {
                position: static;
                transform: none;
                display: inline-flex;
                margin-top: 15px;
                justify-content: center;
                width: auto;
            }
            
            header {
                padding-bottom: 30px;
            }
        }
        
        /* تخصيص شريط التمرير */
        .channels-list::-webkit-scrollbar {
            width: 8px;
        }
        
        .channels-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        
        .channels-list::-webkit-scrollbar-thumb {
            background: #ffdd59;
            border-radius: 4px;
        }
    </style>
    <!-- تشغيل الفيديو عبر hls.js للمتصفحات التي لا تدعم HLS مباشرة -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.1.4/dist/hls.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <a href="https://t.me/stlaet1" class="telegram-btn" target="_blank">
                <i class="fab fa-telegram"></i>
                تابعنا على التلكرام
            </a>
            
            <h1>قنوات beIN Sports</h1>
            <div class="subtitle">البث المباشر لقنوات beIN Sports الرياضية</div>
        </header>
        
        <div class="main-content">
            <section class="player-section">
                <h2 class="section-title">المشغل</h2>
                <div id="video-player">
                    <video id="video-element" controls style="width: 100%; height: 100%;">
                        المتصفح الخاص بك لا يدعم تشغيل الفيديو.
                    </video>
                </div>
                
                <div class="channel-info">
                    <div class="channel-name" id="current-channel">بين سبورت 1</div>
                    <div class="channel-status">
                        <span class="status-live">● بث مباشر</span> | جودة: عالية HD
                    </div>
                </div>
                
                <div class="controls">
                    <button class="control-btn" id="play-btn">تشغيل</button>
                    <button class="control-btn" id="pause-btn">إيقاف مؤقت</button>
                    <button class="control-btn" id="mute-btn">كتم الصوت</button>
                    <button class="control-btn" id="fullscreen-btn">ملء الشاشة</button>
                </div>
            </section>
            
            <section class="channels-section">
                <h2 class="section-title">القنوات المتاحة</h2>
                <div class="channels-list" id="channels-list">
                    <!-- سيتم ملؤها بواسطة JavaScript -->
                </div>
            </section>
        </div>
        
        <footer>
            <p>جميع الحقوق محفوظة لقنوات beIN Sports - هذه الصفحة للعرض التوضيحي فقط</p>
            <p>تستخدم هذه الصفحة تقنية HLS.js لتشغيل تدفقات الفيديو</p>
        </footer>
    </div>

    <script>
        // بيانات القنوات - الروابط مخفية ولا تظهر في الواجهة
        const channels = [
            {
                id: 1,
                name: "بين سبورت 1",
                url: "https://py.dencreak.com/bn_s_hd1.m3u8",
                logo: "https://raw.githubusercontent.com/iptv-logos/main/beIN_Sports/beIN_Sports_1.png"
            },
            {
                id: 2,
                name: "بين سبورت 2",
                url: "https://py.dencreak.com/bn_s_hd2.m3u8",
                logo: "https://raw.githubusercontent.com/iptv-logos/main/beIN_Sports/beIN_Sports_2.png"
            },
            {
                id: 3,
                name: "بين سبورت 3",
                url: "https://py.dencreak.com/bn_s_hd3.m3u8",
                logo: "https://raw.githubusercontent.com/iptv-logos/main/beIN_Sports/beIN_Sports_3.png"
            },
            {
                id: 4,
                name: "بين سبورت 4",
                url: "https://py.dencreak.com/bn_s_hd4.m3u8",
                logo: "https://raw.githubusercontent.com/iptv-logos/main/beIN_Sports/beIN_Sports_4.png"
            },
            {
                id: 5,
                name: "بين سبورت 5",
                url: "https://py.dencreak.com/bn_s_hd5.m3u8",
                logo: "https://raw.githubusercontent.com/iptv-logos/main/beIN_Sports/beIN_Sports_5.png"
            },
            {
                id: 6,
                name: "بين سبورت 6",
                url: "https://py.dencreak.com/bn_s_hd6.m3u8",
                logo: "https://raw.githubusercontent.com/iptv-logos/main/beIN_Sports/beIN_Sports_6.png"
            },
            {
                id: 7,
                name: "بين سبورت 7",
                url: "https://py.dencreak.com/bn_s_hd7.m3u8",
                logo: "https://raw.githubusercontent.com/iptv-logos/main/beIN_Sports/beIN_Sports_7.png"
            }
        ];

        // العناصر الرئيسية في الصفحة
        const videoElement = document.getElementById('video-element');
        const currentChannelElement = document.getElementById('current-channel');
        const channelsListElement = document.getElementById('channels-list');
        const playBtn = document.getElementById('play-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const muteBtn = document.getElementById('mute-btn');
        const fullscreenBtn = document.getElementById('fullscreen-btn');

        // متغيرات التحكم
        let currentChannelIndex = 0;
        let hls = null;
        let isMuted = false;

        // تهيئة الصفحة
        function initPage() {
            // عرض القنوات في القائمة
            renderChannelsList();
            
            // تشغيل القناة الأولى تلقائياً
            loadChannel(channels[currentChannelIndex]);
            
            // إضافة مستمعي الأحداث للأزرار
            setupEventListeners();
        }

        // عرض قائمة القنوات
        function renderChannelsList() {
            channelsListElement.innerHTML = '';
            
            channels.forEach((channel, index) => {
                const channelElement = document.createElement('button');
                channelElement.className = index === currentChannelIndex ? 'channel-btn active' : 'channel-btn';
                
                // عرض فقط اسم القناة وشعارها
                channelElement.innerHTML = `
                    <img src="${channel.logo}" alt="${channel.name}" class="channel-logo">
                    <div style="flex-grow: 1;">
                        <div class="channel-title">${channel.name}</div>
                        <div style="font-size: 0.8rem; color: #ccc;">beIN Sports ${channel.id}</div>
                    </div>
                `;
                
                channelElement.addEventListener('click', () => {
                    currentChannelIndex = index;
                    loadChannel(channel);
                    updateActiveChannel();
                });
                
                channelsListElement.appendChild(channelElement);
            });
        }

        // تحديث القناة النشطة في القائمة
        function updateActiveChannel() {
            const channelButtons = document.querySelectorAll('.channel-btn');
            channelButtons.forEach((btn, index) => {
                if (index === currentChannelIndex) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        // تحميل وتشغيل القناة
        function loadChannel(channel) {
            // تحديث معلومات القناة الحالية
            currentChannelElement.textContent = channel.name;
            
            // إيقاف أي تدفق سابق
            if (hls) {
                hls.destroy();
            }
            
            // تحقق إذا كان المتصفح يدعم HLS بشكل مباشر
            if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
                videoElement.src = channel.url;
                videoElement.play();
            } 
            // استخدم hls.js للمتصفحات الأخرى
            else if (Hls.isSupported()) {
                hls = new Hls();
                hls.loadSource(channel.url);
                hls.attachMedia(videoElement);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    videoElement.play();
                });
            } 
            // رسالة خطأ إذا لم يدعم المتصفح أي من الخيارات
            else {
                alert('المتصفح الخاص بك لا يدعم تشغيل هذا النوع من الفيديو');
            }
        }

        // إعداد مستمعي الأحداث
        function setupEventListeners() {
            // زر التشغيل
            playBtn.addEventListener('click', () => {
                videoElement.play();
            });
            
            // زر الإيقاف المؤقت
            pauseBtn.addEventListener('click', () => {
                videoElement.pause();
            });
            
            // زر كتم الصوت
            muteBtn.addEventListener('click', () => {
                isMuted = !isMuted;
                videoElement.muted = isMuted;
                muteBtn.textContent = isMuted ? "إلغاء كتم الصوت" : "كتم الصوت";
            });
            
            // زر ملء الشاشة
            fullscreenBtn.addEventListener('click', () => {
                if (videoElement.requestFullscreen) {
                    videoElement.requestFullscreen();
                } else if (videoElement.mozRequestFullScreen) { // فايرفوكس
                    videoElement.mozRequestFullScreen();
                } else if (videoElement.webkitRequestFullscreen) { // كروم، سفاري
                    videoElement.webkitRequestFullscreen();
                } else if (videoElement.msRequestFullscreen) { // انترنت إكسبلورر/إيدج
                    videoElement.msRequestFullscreen();
                }
            });
            
            // عرض رسالة عند حدوث خطأ في الفيديو
            videoElement.addEventListener('error', (e) => {
                console.error('خطأ في تشغيل الفيديو:', e);
                currentChannelElement.innerHTML = `<span style="color:#ff6b6b">خطأ في تحميل ${channels[currentChannelIndex].name}</span>`;
            });
            
            // تحديث زر التشغيل/الإيقاف بناءً على حالة الفيديو
            videoElement.addEventListener('play', () => {
                playBtn.textContent = "تشغيل";
            });
            
            videoElement.addEventListener('pause', () => {
                playBtn.textContent = "استئناف";
            });
        }

        // تهيئة الصفحة عند تحميلها
        document.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>
</html>
