<style>
:root {
  --primary: #4361ee;
  --accent: #f72585;
  --glass-bg: rgba(255, 255, 255, 0.1);
  --glass-border: rgba(255, 255, 255, 0.15);
  --blur: blur(15px);
  --player-bg: #0a0a1a;
} 

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
} 

body {
  font-family: 'Cairo', sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  padding: 15px;
  min-height: 100vh;
  overflow-x: hidden;
  transition: background 0.5s ease;
} 

body.fullscreen-mode {
  background: #000;
  padding: 0;
}

body.fullscreen-mode .header,
body.fullscreen-mode .search-section,
body.fullscreen-mode .filter-buttons,
body.fullscreen-mode .channels-section {
  display: none;
}

body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: 
    radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
    radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.3) 0%, transparent 50%);
  z-index: -1;
} 

.glass-panel {
  background: var(--glass-bg);
  backdrop-filter: var(--blur);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
} 

.header {
  text-align: center;
  padding: 20px;
  margin-bottom: 15px;
} 

.header h1 {
  font-size: 2rem;
  background: linear-gradient(135deg, #fff 0%, #e2e8ff 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  margin-bottom: 5px;
} 

.subtitle {
  color: rgba(255, 255, 255, 0.8);
  font-size: 0.9rem;
} 

.telegram-link {
  margin-top: 10px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(0, 136, 204, 0.2);
  padding: 8px 16px;
  border-radius: 12px;
  color: white;
  text-decoration: none;
  font-weight: 600;
  transition: all 0.3s ease;
} 

.telegram-link:hover {
  background: rgba(0, 136, 204, 0.3);
  transform: translateY(-2px);
} 

.search-section {
  margin-bottom: 15px;
  padding: 15px;
} 

.search-box {
  width: 100%;
  padding: 12px 18px;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 12px;
  font-family: 'Cairo', sans-serif;
  font-size: 14px;
  color: white;
  outline: none;
  transition: all 0.3s ease;
} 

.search-box::placeholder {
  color: rgba(255, 255, 255, 0.6);
} 

.search-box.focused {
  background: rgba(255, 255, 255, 0.15);
  border: 2px solid rgba(67, 97, 238, 0.6);
  box-shadow: 0 0 15px rgba(67, 97, 238, 0.3);
} 

.filter-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 15px;
  justify-content: center;
} 

.filter-btn {
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.15);
  color: rgba(255, 255, 255, 0.9);
  padding: 8px 16px;
  border-radius: 12px;
  cursor: pointer;
  font-family: 'Cairo', sans-serif;
  font-weight: 600;
  font-size: 0.8rem;
  transition: all 0.3s ease;
} 

.filter-btn.active, .filter-btn.focused {
  background: rgba(67, 97, 238, 0.3);
  border-color: rgba(67, 97, 238, 0.6);
  box-shadow: 0 0 10px rgba(67, 97, 238, 0.3);
} 

.channels-section {
  padding: 15px;
  transition: opacity 0.3s ease;
} 

.channels-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
} 

.channel-card {
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 12px;
  padding: 12px;
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
  min-height: 120px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
} 

.channel-card:hover {
  background: rgba(255, 255, 255, 0.12);
  border-color: rgba(255, 255, 255, 0.2);
  transform: translateY(-2px);
} 

.channel-card.focused {
  background: rgba(67, 97, 238, 0.2);
  border: 2px solid rgba(67, 97, 238, 0.6);
  transform: scale(1.05);
  box-shadow: 0 0 20px rgba(67, 97, 238, 0.4);
} 

.channel-logo {
  width: 50px;
  height: 50px;
  object-fit: contain;
  border-radius: 8px;
  margin-bottom: 8px;
} 

.channel-name {
  font-weight: 600;
  color: white;
  font-size: 0.8rem;
  text-align: center;
  margin-bottom: 4px;
} 

.quality-badge {
  position: absolute;
  top: 8px;
  left: 8px;
  background: rgba(67, 97, 238, 0.8);
  color: white;
  padding: 3px 6px;
  border-radius: 6px;
  font-size: 0.6rem;
  font-weight: 600;
} 

.live-badge {
  position: absolute;
  top: 8px;
  right: 8px;
  background: rgba(247, 37, 133, 0.8);
  color: white;
  padding: 3px 6px;
  border-radius: 6px;
  font-size: 0.6rem;
  font-weight: 600;
} 

.group-header {
  grid-column: 1 / -1;
  font-size: 1.2rem;
  font-weight: 700;
  margin: 20px 0 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.2);
  color: white;
} 

.special-group {
  position: relative;
  margin-top: 20px;
} 

.special-group::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
} 

.group-description {
  font-size: 0.8rem;
  color: rgba(255, 255, 255, 0.7);
  margin-top: 5px;
  font-weight: 300;
} 

.loading {
  text-align: center;
  padding: 40px 20px;
  color: white;
  grid-column: 1 / -1;
} 

.spinner {
  width: 30px;
  height: 30px;
  border: 3px solid rgba(255, 255, 255, 0.3);
  border-top: 3px solid white;
  border-radius: 50%;
  margin: 0 auto 15px;
  animation: spin 1s linear infinite;
} 

@keyframes spin {
  to { transform: rotate(360deg); }
} 

.no-results {
  text-align: center;
  padding: 30px;
  color: rgba(255, 255, 255, 0.6);
  grid-column: 1 / -1;
} 

/* Advanced Player Styles */
#video-player-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: var(--player-bg);
  z-index: 10000;
  display: none;
  flex-direction: column;
  opacity: 0;
  transition: opacity 0.3s ease;
}

#video-player-container.active {
  display: flex;
  opacity: 1;
}

#video-player-container.fullscreen {
  z-index: 99999;
}

.player-header {
  padding: 15px 20px;
  background: rgba(0, 0, 0, 0.8);
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: white;
  z-index: 10;
}

.channel-info {
  display: flex;
  align-items: center;
  gap: 15px;
}

.channel-info img {
  width: 40px;
  height: 40px;
  border-radius: 8px;
}

.channel-info h3 {
  font-size: 1.2rem;
  font-weight: 600;
}

.player-controls {
  display: flex;
  gap: 10px;
}

.control-btn {
  background: rgba(255, 255, 255, 0.1);
  border: none;
  color: white;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.3s ease;
  font-size: 1.2rem;
}

.control-btn:hover {
  background: rgba(255, 255, 255, 0.2);
  transform: scale(1.1);
}

#video-wrapper {
  flex: 1;
  position: relative;
  overflow: hidden;
}

#my-video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
}

.video-js {
  width: 100%;
  height: 100%;
  background: #000;
}

.vjs-poster {
  background-size: contain !important;
}

.player-loading {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: white;
  text-align: center;
  z-index: 5;
}

.player-error {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #ff4757;
  text-align: center;
  background: rgba(0, 0, 0, 0.8);
  padding: 30px;
  border-radius: 12px;
  max-width: 80%;
  z-index: 5;
}

.player-error button {
  margin-top: 15px;
  background: var(--primary);
  color: white;
  border: none;
  padding: 10px 20px;
  border-radius: 8px;
  cursor: pointer;
  font-family: 'Cairo', sans-serif;
}

.quality-selector {
  position: absolute;
  bottom: 100px;
  left: 20px;
  background: rgba(0, 0, 0, 0.8);
  border-radius: 8px;
  padding: 10px;
  display: none;
  z-index: 20;
}

.quality-selector.active {
  display: block;
}

.quality-option {
  color: white;
  padding: 8px 15px;
  cursor: pointer;
  border-radius: 4px;
  transition: background 0.3s ease;
}

.quality-option:hover {
  background: rgba(255, 255, 255, 0.1);
}

.quality-option.selected {
  background: var(--primary);
}

.remote-controls {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: none;
  gap: 10px;
  background: rgba(0, 0, 0, 0.7);
  padding: 15px;
  border-radius: 20px;
  backdrop-filter: blur(10px);
  z-index: 1000;
} 

.remote-btn {
  width: 50px;
  height: 50px;
  background: rgba(255, 255, 255, 0.2);
  border: none;
  border-radius: 12px;
  color: white;
  font-size: 1.2rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
} 

.remote-btn:active {
  background: rgba(255, 255, 255, 0.3);
  transform: scale(0.95);
} 

@media (max-width: 768px) {
  .channels-grid {

  .player-header {

  .channel-info h3 {

@media (max-width: 480px) {

  .player-header {

  }

@media (min-width: 1024px) {
  .remote-controls {

  }
}

@media (orientation: landscape) and (max-height: 500px) {

  }
  
  .channel-info img {
    width: 30px;
    height: 30px;
  }

    url: "https://liveeu-gcp.alkassdigital.net/alkass4-p/main.m3u8",
    quality: "HD",
    status: "مباشر",
    bitrate: "عالية"
  },
  {
    name: "الكاس 5",
    logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/6/6a/Alkass_logo.svg/1200px-Alkass_logo.svg.png",
    group: "قنوات الكاس",
    category: "رياضي",
    url: "https://liveeu-gcp.alkassdigital.net/alkass5-p/main.m3u8",
    quality: "HD",
    status: "مباشر",
    bitrate: "عالية"
  }
]; 

// متغيرات النظام
let allChannels = [];
let currentFilter = "all";
let currentFocusIndex = 0;
let channelCards = [];
let filterButtons = [];
let currentPlayer = null;
let currentChannel = null;
let hls = null;

// عناصر واجهة المشغل
const playerContainer = document.getElementById('video-player-container');
const playerChannelLogo = document.getElementById('player-channel-logo');
const playerChannelName = document.getElementById('player-channel-name');
const closePlayerBtn = document.getElementById('close-player');
const fullscreenBtn = document.getElementById('fullscreen-btn');
const qualityBtn = document.getElementById('quality-btn');
const qualitySelector = document.getElementById('quality-selector');
const playerLoading = document.getElementById('player-loading');
const playerError = document.getElementById('player-error');
const errorMessage = document.getElementById('error-message');
const retryBtn = document.getElementById('retry-btn');
const searchInput = document.getElementById('search-input'); 

// تهيئة مشغل الفيديو Video.js
const videoPlayer = videojs('my-video', {
  controls: true,
  autoplay: true,
  preload: 'auto',
  fluid: true,
  liveui: true,
  playbackRates: [0.5, 1, 1.5, 2],
  controlBar: {
    children: [
      'playToggle',
      'volumePanel',
      'currentTimeDisplay',
      'timeDivider',
      'durationDisplay',
      'progressControl',
      'liveDisplay',
      'remainingTimeDisplay',
      'customControlSpacer',
      'playbackRateMenuButton',
      'chaptersButton',
      'descriptionsButton',
      'subsCapsButton',
      'audioTrackButton',
      'fullscreenToggle'
    ]
  }
});

// تعطيل خاصية PiP (Picture-in-Picture) على الهواتف
if ('pictureInPictureEnabled' in document) {
  videoPlayer.tech_.off('doubletap');
}

// دالة تحميل القنوات
function loadChannels() {
  try {
    allChannels = channelsData;
    createFilterButtons();
    displayChannels(allChannels);
    setupRemoteNavigation();
    setupPlayerEvents();
    
    searchInput.addEventListener('input', function(e) {
      const searchTerm = e.target.value.toLowerCase();
      const filteredChannels = allChannels.filter(channel => 
        channel.name.toLowerCase().includes(searchTerm) || 
        channel.group.toLowerCase().includes(searchTerm)
      );
      displayChannels(filteredChannels);
      setupRemoteNavigation();
    });

  } catch (e) {
    document.getElementById("loading").innerHTML = "❌ فشل تحميل القنوات";
    console.error("خطأ في تحميل القنوات:", e);
  }
}

// إعداد أحداث المشغل
function setupPlayerEvents() {
  // زر إغلاق المشغل
  closePlayerBtn.addEventListener('click', closePlayer);
  
  // زر ملء الشاشة
  fullscreenBtn.addEventListener('click', toggleFullscreen);
  
  // زر اختيار الجودة
  qualityBtn.addEventListener('click', toggleQualitySelector);
  
  // زر إعادة المحاولة
  retryBtn.addEventListener('click', retryPlayback);
  
  // إخفاء منتقي الجودة عند النقر خارجها
  document.addEventListener('click', (e) => {
    if (!qualitySelector.contains(e.target) && e.target !== qualityBtn) {
      qualitySelector.classList.remove('active');
    }
  });
  
  // أحداث مشغل الفيديو
  videoPlayer.on('error', function() {
    showPlayerError('حدث خطأ في تحميل الفيديو. قد يكون الرابط غير صالح أو الخادم غير متاح.');
  });
  
  videoPlayer.on('waiting', function() {
    showLoading();
  });
  
  videoPlayer.on('playing', function() {
    hideLoading();
    hideError();
  });
  
  videoPlayer.on('loadeddata', function() {
    hideLoading();
    hideError();
  });
}

// دالة إنشاء أزرار التصفية
function createFilterButtons() {
  const filterContainer = document.getElementById("filter-buttons");
  filterContainer.innerHTML = '';
  
  const categories = [...new Set(allChannels.map(ch => ch.category))];
  
  const allButton = document.createElement("button");
  allButton.className = "filter-btn active";
  allButton.textContent = "الكل";
  allButton.onclick = () => filterChannels("all");
  filterContainer.appendChild(allButton);
  
  categories.forEach(category => {
    const button = document.createElement("button");
    button.className = "filter-btn";
    button.textContent = category;
    button.onclick = () => filterChannels(category);
    filterContainer.appendChild(button);
  });
  
  filterButtons = Array.from(document.querySelectorAll('.filter-btn'));
}

// دالة تصفية القنوات
function filterChannels(category) {
  currentFilter = category;
  
  filterButtons.forEach(btn => {
    btn.classList.remove('active');
  });
  
  event.target.classList.add('active');
  
  const filteredChannels = category === "all" 
    ? allChannels 
    : allChannels.filter(ch => ch.category === category);
  
  displayChannels(filteredChannels);
  setupRemoteNavigation();
}

// دالة عرض القنوات
function displayChannels(channels) {
  const grid = document.getElementById("channels");
  grid.innerHTML = ""; 

  if (channels.length === 0) {
    grid.innerHTML = '<div class="no-results">لم يتم العثور على قنوات</div>';
    return;
  } 

  const groupedChannels = {};
  channels.forEach(ch => {
    if (!groupedChannels[ch.group]) {
      groupedChannels[ch.group] = [];
    }
    groupedChannels[ch.group].push(ch);
  }); 

  for (const group in groupedChannels) {
    const groupHeader = document.createElement("div");
    groupHeader.className = "group-header";
    
    // إضافة وصف خاص للمجموعات المميزة
    if (group === "سيرفر شركة ايرثلنك") {
      groupHeader.innerHTML = `
        <div>${group}</div>
        <div class="group-description">سيرفر خاص لمشتركين ايرثلنك 🔴</div>
      `;
      groupHeader.classList.add("special-group");
    } else {
      groupHeader.textContent = group;
    }
    
    grid.appendChild(groupHeader);
    
    groupedChannels[group].forEach((ch, index) => {
      const card = document.createElement("div");
      card.className = "channel-card";
      card.tabIndex = 0;
      card.dataset.channelIndex = index;
      
      card.innerHTML = `
        <img src="${ch.logo}" alt="${ch.name}" class="channel-logo" onerror="this.src='https://via.placeholder.com/50/667eea/ffffff?text=TV'">
        <div class="quality-badge">${ch.quality}</div>
        <div class="live-badge">LIVE</div>
        <div class="channel-name">${ch.name}</div>
      `;
      
      card.onclick = () => playChannel(ch);
      
      grid.appendChild(card);
    });
  } 

  document.getElementById("loading").style.display = "none";
}

// دالة تشغيل القناة
function playChannel(channel) {
  currentChannel = channel;
  
  // تحديث معلومات القناة في المشغل
  playerChannelName.textContent = channel.name;
  playerChannelLogo.src = channel.logo;
  
  // إظهار المشغل
  playerContainer.classList.add('active');
  document.body.classList.add('fullscreen-mode');
  
  // إخفاء رسائل الخطأ والتحميل السابقة
  hideError();
  hideLoading();
  
  // تشغيل الفيديو
  playStream(channel.url);
}

// دالة تشغيل البث
function playStream(url) {
  showLoading();
  
  // إيقاف أي بث سابق
  if (hls) {
    hls.destroy();
    hls = null;
  }
  
  // إعادة تعيين مشغل الفيديو
  videoPlayer.pause();
  videoPlayer.reset();
  
  // التحقق من دعم HLS
  if (Hls.isSupported()) {
    hls = new Hls({
      enableWorker: true,
      lowLatencyMode: true,
      backBufferLength: 90,
      maxBufferLength: 30,
      maxMaxBufferLength: 60,
      maxBufferSize: 60 * 1000 * 1000,
      maxBufferHole: 0.5,
      maxSeekHole: 2,
      maxFragLookUpTolerance: 0.2,
      liveSyncDurationCount: 3,
      liveMaxLatencyDurationCount: 10,
      enableSoftwareAES: true,
      manifestLoadingTimeOut: 10000,
      manifestLoadingMaxRetry: 3,
      manifestLoadingRetryDelay: 500,
      manifestLoadingMaxRetryTimeout: 10000,
      levelLoadingTimeOut: 10000,
      levelLoadingMaxRetry: 3,
      levelLoadingRetryDelay: 500,
      levelLoadingMaxRetryTimeout: 10000,
      fragLoadingTimeOut: 20000,
      fragLoadingMaxRetry: 6,
      fragLoadingRetryDelay: 500,
      fragLoadingMaxRetryTimeout: 60000,
      startFragPrefetch: true,
      testBandwidth: true,
      autoStartLoad: true,
      startPosition: -1,
      capLevelToPlayerSize: true,
      capLevelOnFPSDrop: true,
      fpsDroppedMonitoringPeriod: 5000,
      fpsDroppedMonitoringThreshold: 0.2
    });
    
    hls.loadSource(url);
    hls.attachMedia(videoPlayer.tech().el());
    
    hls.on(Hls.Events.MANIFEST_PARSED, function() {
      hideLoading();
      videoPlayer.play().catch(e => {
        showPlayerError('تعذر تشغيل الفيديو تلقائياً. يرجى النقر على زر التشغيل.');
      });
      
      // إنشاء قائمة الجودة إذا كان الملف يحتوي على مستويات متعددة
      if (hls.levels && hls.levels.length > 1) {
        createQualityOptions(hls.levels);
      }
    });
    
    hls.on(Hls.Events.ERROR, function(event, data) {
      console.error('HLS Error:', data);
      if (data.fatal) {
        switch(data.type) {
          case Hls.ErrorTypes.NETWORK_ERROR:
            showPlayerError('خطأ في الشبكة. يرجى التحقق من اتصال الإنترنت.');
            break;
          case Hls.ErrorTypes.MEDIA_ERROR:
            showPlayerError('خطأ في الملف الوسائط. قد يكون الرابط تالفاً.');
            break;
          default:
            showPlayerError('حدث خطأ غير معروف في تشغيل الفيديو.');
            break;
        }
      }
    });
    
  } else if (videoPlayer.canPlayType('application/vnd.apple.mpegurl')) {
    // دعم HLS الأصلي في Safari
    videoPlayer.src({
      src: url,
      type: 'application/x-mpegURL'
    });
    
    videoPlayer.one('loadeddata', function() {
      hideLoading();
      videoPlayer.play().catch(e => {
        showPlayerError('تعذر تشغيل الفيديو تلقائياً. يرجى النقر على زر التشغيل.');
      });
    });
    
    videoPlayer.on('error', function() {
      showPlayerError('تعذر تحميل الفيديو. قد يكون الرابط غير صالح.');
    });
    
  } else {
    showPlayerError('متصفحك لا يدعم تشغيل تنسيق HLS. يرجى استخدام متصفح حديث.');
  }
}

// دالة إنشاء خيارات الجودة
function createQualityOptions(levels) {
  qualitySelector.innerHTML = '';
  
  levels.forEach((level, index) => {
    const option = document.createElement('div');
    option.className = 'quality-option';
    option.textContent = level.height ? `${level.height}p` : `مستوى ${index + 1}`;
    option.dataset.level = index;
    
    option.addEventListener('click', () => {
      hls.currentLevel = parseInt(index);
      qualitySelector.querySelectorAll('.quality-option').forEach(opt => {
        opt.classList.remove('selected');
      });
      option.classList.add('selected');
      qualitySelector.classList.remove('active');
    });
    
    if (index === hls.currentLevel) {
      option.classList.add('selected');
    }
    
    qualitySelector.appendChild(option);
  });
}

// دالة إظهار/إخفاء منتقي الجودة
function toggleQualitySelector() {
  qualitySelector.classList.toggle('active');
}

// دالة تبديل وضع ملء الشاشة
function toggleFullscreen() {
  if (!document.fullscreenElement) {
    playerContainer.requestFullscreen().catch(err => {
      console.error(`خطأ في تفعيل ملء الشاشة: ${err.message}`);
    });
    playerContainer.classList.add('fullscreen');
  } else {
    document.exitFullscreen();
    playerContainer.classList.remove('fullscreen');
  }
}

// دالة إغلاق المشغل
function closePlayer() {
  playerContainer.classList.remove('active');
  document.body.classList.remove('fullscreen-mode');
  
  // إيقاف الفيديو
  videoPlayer.pause();
  
  // إيقاف HLS إذا كان يعمل
  if (hls) {
    hls.destroy();
    hls = null;
  }
  
  // الخروج من وضع ملء الشاشة
  if (document.fullscreenElement) {
    document.exitFullscreen();
  }
}

// دالة إعادة المحاولة
function retryPlayback() {
  if (currentChannel) {
    playStream(currentChannel.url);
  }
}

// دوال التحكم في واجهة المشغل
function showLoading() {
  playerLoading.style.display = 'block';
}

function hideLoading() {
  playerLoading.style.display = 'none';
}

function showPlayerError(message) {
  errorMessage.textContent = message;
  playerError.style.display = 'block';
}

function hideError() {
  playerError.style.display = 'none';
}

// إعدادات التحكم عن بعد
function setupRemoteNavigation() {
  channelCards = Array.from(document.querySelectorAll('.channel-card'));
  filterButtons = Array.from(document.querySelectorAll('.filter-btn'));
  currentFocusIndex = 0;
  
  // Clear all focus
  searchInput.classList.remove('focused');
  filterButtons.forEach(btn => btn.classList.remove('focused'));
  channelCards.forEach(card => card.classList.remove('focused'));
  
  if (channelCards.length > 0) {
    channelCards[currentFocusIndex].classList.add('focused');
    channelCards[currentFocusIndex].focus();
  }
  
  // Keyboard navigation
  document.addEventListener('keydown', function(e) {
    // تجاهل الأزرار إذا كان المشغل مفتوحاً
    if (playerContainer.classList.contains('active')) {
      // السماح بمفاتيح التحكم في الفيديو فقط
      if (e.key === 'Escape') {
        closePlayer();
      } else if (e.key === 'f' || e.key === 'F') {
        toggleFullscreen();
      }
      return;
    }
    
    switch(e.key) {
      case 'ArrowUp':
        e.preventDefault();
        navigateRemote('up');
        break;
      case 'ArrowDown':
        e.preventDefault();
        navigateRemote('down');
        break;
      case 'ArrowLeft':
        e.preventDefault();
        navigateRemote('left');
        break;
      case 'ArrowRight':
        e.preventDefault();
        navigateRemote('right');
        break;
      case 'Enter':
        e.preventDefault();
        activateCurrent();
        break;
      case 'Escape':
        // لا شيء - للخروج من البحث
        break;
    }
  });
}

function navigateRemote(direction) {
  if (channelCards.length === 0) return;
  
  const oldIndex = currentFocusIndex;
  let newIndex = currentFocusIndex;
  const columns = window.innerWidth < 768 ? 2 : 3;
  
  switch(direction) {
    case 'up':
      newIndex = Math.max(0, currentFocusIndex - columns);
      break;
    case 'down':
      newIndex = Math.min(channelCards.length - 1, currentFocusIndex + columns);
      break;
    case 'left':
      newIndex = Math.max(0, currentFocusIndex - 1);
      break;
    case 'right':
      newIndex = Math.min(channelCards.length - 1, currentFocusIndex + 1);
      break;
  }
  
  if (newIndex !== oldIndex) {
    channelCards[oldIndex].classList.remove('focused');
    channelCards[newIndex].classList.add('focused');
    channelCards[newIndex].focus();
    currentFocusIndex = newIndex;
    
    // Scroll into view
    channelCards[newIndex].scrollIntoView({
      behavior: 'smooth',
      block: 'center'
    });
  }
}

function activateCurrent() {
  if (channelCards.length > 0) {
    const channelIndex = channelCards[currentFocusIndex].dataset.channelIndex;
    const groupHeader = channelCards[currentFocusIndex].closest('.group-header');
    const groupName = groupHeader ? groupHeader.textContent.trim() : '';
    
    // البحث عن القناة المناسبة
    const channel = allChannels.find(ch => 
      ch.name === channelCards[currentFocusIndex].querySelector('.channel-name').textContent &&
      ch.group === groupName
    );
    
    if (channel) {
      playChannel(channel);
    }
  }
}

// إدارة أحداث ملء الشاشة
document.addEventListener('fullscreenchange', function() {
  if (!document.fullscreenElement) {
    playerContainer.classList.remove('fullscreen');
  }
});

// Simple search focus for when user wants to type
searchInput.addEventListener('focus', () => {
  // Clear channel focus when searching
  channelCards.forEach(card => card.classList.remove('focused'));
}); 

// تهيئة التطبيق
loadChannels();
</script>
