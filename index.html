<style>
:root {
  --primary: #4361ee;
  --accent: #f72585;
  --glass-bg: rgba(255, 255, 255, 0.1);
  --glass-border: rgba(255, 255, 255, 0.15);
  --blur: blur(15px);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Cairo', sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  padding: 15px;
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: 
    radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
    radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.3) 0%, transparent 50%);
  z-index: -1;
}

.glass-panel {
  background: var(--glass-bg);
  backdrop-filter: var(--blur);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
}

.header {
  text-align: center;
  padding: 20px;
  margin-bottom: 15px;
}

.header h1 {
  font-size: 2rem;
  background: linear-gradient(135deg, #fff 0%, #e2e8ff 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  margin-bottom: 5px;
}

.subtitle {
  color: rgba(255, 255, 255, 0.8);
  font-size: 0.9rem;
}

.telegram-link {
  margin-top: 10px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(0, 136, 204, 0.2);
  padding: 8px 16px;
  border-radius: 12px;
  color: white;
  text-decoration: none;
  font-weight: 600;
  transition: all 0.3s ease;
}

.telegram-link:hover {
  background: rgba(0, 136, 204, 0.3);
  transform: translateY(-2px);
}

.search-section {
  margin-bottom: 15px;
  padding: 15px;
}

.search-box {
  width: 100%;
  padding: 12px 18px;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 12px;
  font-family: 'Cairo', sans-serif;
  font-size: 14px;
  color: white;
  outline: none;
  transition: all 0.3s ease;
}

.search-box::placeholder {
  color: rgba(255, 255, 255, 0.6);
}

.search-box.focused {
  background: rgba(255, 255, 255, 0.15);
  border: 2px solid rgba(67, 97, 238, 0.6);
  box-shadow: 0 0 15px rgba(67, 97, 238, 0.3);
}

.filter-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 15px;
  justify-content: center;
}

.filter-btn {
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.15);
  color: rgba(255, 255, 255, 0.9);
  padding: 8px 16px;
  border-radius: 12px;
  cursor: pointer;
  font-family: 'Cairo', sans-serif;
  font-weight: 600;
  font-size: 0.8rem;
  transition: all 0.3s ease;
}

.filter-btn.active, .filter-btn.focused {
  background: rgba(67, 97, 238, 0.3);
  border-color: rgba(67, 97, 238, 0.6);
  box-shadow: 0 0 10px rgba(67, 97, 238, 0.3);
}

.channels-section {
  padding: 15px;
}

.channels-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.channel-card {
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 12px;
  padding: 12px;
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
  min-height: 120px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.channel-card:hover {
  background: rgba(255, 255, 255, 0.12);
  border-color: rgba(255, 255, 255, 0.2);
  transform: translateY(-2px);
}

.channel-card.focused {
  background: rgba(67, 97, 238, 0.2);
  border: 2px solid rgba(67, 97, 238, 0.6);
  transform: scale(1.05);
  box-shadow: 0 0 20px rgba(67, 97, 238, 0.4);
}

.channel-logo {
  width: 50px;
  height: 50px;
  object-fit: contain;
  border-radius: 8px;
  margin-bottom: 8px;
}

.channel-name {
  font-weight: 600;
  color: white;
  font-size: 0.8rem;
  text-align: center;
  margin-bottom: 4px;
}

.quality-badge {
  position: absolute;
  top: 8px;
  left: 8px;
  background: rgba(67, 97, 238, 0.8);
  color: white;
  padding: 3px 6px;
  border-radius: 6px;
  font-size: 0.6rem;
  font-weight: 600;
}

.live-badge {
  position: absolute;
  top: 8px;
  right: 8px;
  background: rgba(247, 37, 133, 0.8);
  color: white;
  padding: 3px 6px;
  border-radius: 6px;
  font-size: 0.6rem;
  font-weight: 600;
}

.group-header {
  grid-column: 1 / -1;
  font-size: 1.2rem;
  font-weight: 700;
  margin: 20px 0 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.2);
  color: white;
}

.special-group {
  position: relative;
  margin-top: 20px;
}

.special-group::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
}

.group-description {
  font-size: 0.8rem;
  color: rgba(255, 255, 255, 0.7);
  margin-top: 5px;
  font-weight: 300;
}

.loading {
  text-align: center;
  padding: 40px 20px;
  color: white;
  grid-column: 1 / -1;
}

.spinner {
  width: 30px;
  height: 30px;
  border: 3px solid rgba(255, 255, 255, 0.3);
  border-top: 3px solid white;
  border-radius: 50%;
  margin: 0 auto 15px;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.no-results {
  text-align: center;
  padding: 30px;
  color: rgba(255, 255, 255, 0.6);
  grid-column: 1 / -1;
}

/* مشغل الفيديو */
.video-player-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.95);
  z-index: 10000;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
}

.video-player-container.active {
  opacity: 1;
  visibility: visible;
}

.video-player {
  width: 90%;
  max-width: 1200px;
  background: #000;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 10px 50px rgba(0, 0, 0, 0.7);
  position: relative;
}

#videoElement {
  width: 100%;
  height: 60vh;
  display: block;
  background: #000;
}

.player-controls {
  background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 15px;
  position: absolute;
  bottom: 0;
  width: 100%;
  transform: translateY(100%);
  transition: transform 0.3s ease;
}

.video-player:hover .player-controls {
  transform: translateY(0);
}

.controls-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.channel-info {
  display: flex;
  align-items: center;
  gap: 15px;
}

.channel-info img {
  width: 40px;
  height: 40px;
  border-radius: 8px;
}

.channel-info-text h3 {
  color: white;
  font-size: 1.2rem;
  margin-bottom: 5px;
}

.channel-info-text p {
  color: rgba(255, 255, 255, 0.7);
  font-size: 0.9rem;
}

.control-buttons {
  display: flex;
  gap: 10px;
}

.control-btn {
  background: rgba(255, 255, 255, 0.1);
  border: none;
  color: white;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.3s ease;
}

.control-btn:hover {
  background: rgba(255, 255, 255, 0.2);
  transform: scale(1.1);
}

.control-btn.fullscreen-btn {
  background: var(--primary);
}

.controls-bottom {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.progress-container {
  width: 100%;
  height: 5px;
  background: rgba(255, 255, 255, 0.2);
  border-radius: 3px;
  cursor: pointer;
  position: relative;
}

.progress-bar {
  height: 100%;
  background: var(--primary);
  border-radius: 3px;
  width: 0%;
  position: relative;
}

.progress-bar::after {
  content: '';
  position: absolute;
  right: -6px;
  top: 50%;
  transform: translateY(-50%);
  width: 12px;
  height: 12px;
  background: white;
  border-radius: 50%;
  opacity: 0;
  transition: opacity 0.2s;
}

.progress-container:hover .progress-bar::after {
  opacity: 1;
}

.bottom-controls {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.time-display {
  color: white;
  font-size: 0.9rem;
}

.volume-control {
  display: flex;
  align-items: center;
  gap: 8px;
}

.volume-slider {
  width: 80px;
  height: 4px;
  background: rgba(255, 255, 255, 0.2);
  border-radius: 2px;
  cursor: pointer;
  position: relative;
}

.volume-level {
  height: 100%;
  background: white;
  border-radius: 2px;
  width: 80%;
}

.close-player {
  position: absolute;
  top: 20px;
  right: 20px;
  background: rgba(255, 255, 255, 0.1);
  border: none;
  color: white;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  font-size: 1.5rem;
  cursor: pointer;
  z-index: 10001;
  transition: all 0.3s ease;
}

.close-player:hover {
  background: rgba(255, 255, 255, 0.2);
  transform: rotate(90deg);
}

.playback-options {
  position: absolute;
  top: 20px;
  left: 20px;
  display: flex;
  gap: 10px;
  z-index: 10001;
}

.quality-selector {
  background: rgba(0, 0, 0, 0.7);
  color: white;
  border: 1px solid rgba(255, 255, 255, 0.3);
  border-radius: 8px;
  padding: 8px 15px;
  font-family: 'Cairo', sans-serif;
  cursor: pointer;
}

.error-message {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: white;
  background: rgba(255, 0, 0, 0.7);
  padding: 15px 25px;
  border-radius: 10px;
  text-align: center;
  display: none;
}

.buffering-indicator {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  display: none;
}

.buffering-spinner {
  width: 50px;
  height: 50px;
  border: 4px solid rgba(255, 255, 255, 0.3);
  border-top: 4px solid white;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

.remote-controls {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: none;
  gap: 10px;
  background: rgba(0, 0, 0, 0.7);
  padding: 15px;
  border-radius: 20px;
  backdrop-filter: blur(10px);
  z-index: 1000;
}

.remote-btn {
  width: 50px;
  height: 50px;
  background: rgba(255, 255, 255, 0.2);
  border: none;
  border-radius: 12px;
  color: white;
  font-size: 1.2rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
}

.remote-btn:active {
  background: rgba(255, 255, 255, 0.3);
  transform: scale(0.95);
}

@media (max-width: 768px) {
  .channels-grid {
    grid-template-columns: repeat(2, 1fr);
  }
  
  .video-player {
    width: 100%;
    height: 100%;
    border-radius: 0;
  }
  
  #videoElement {
    height: 70vh;
  }
  
  .player-controls {
    transform: translateY(0);
    background: rgba(0, 0, 0, 0.8);
  }
  
  .controls-top {
    flex-direction: column;
    gap: 15px;
    align-items: flex-start;
  }
}

@media (max-width: 480px) {
  .channels-grid {
    grid-template-columns: 1fr;
  }
  
  .control-buttons {
    flex-wrap: wrap;
    justify-content: center;
  }
}

@media (min-width: 1024px) {
  .remote-controls {
    display: flex;
  }
}
</style>

            </div>
          </div>
        </div>
      </div>
    </div>

    </div>
    
    <div class="buffering-indicator" id="bufferingIndicator">
      <div class="buffering-spinner"></div>
    </div>
  </div>
</div>

<div class="remote-controls">

// متغيرات المشغل
let allChannels = [];
let currentFilter = "all";
let currentFocusIndex = 0;
let channelCards = [];
let filterButtons = [];

// متغيرات HLS
let hls = null;
let videoElement = document.getElementById('videoElement');
let videoPlayerContainer = document.getElementById('videoPlayerContainer');
let isPlaying = false;
let currentVolume = 0.8;
let isMuted = false;
let currentChannel = null;

// عناصر التحكم
const searchInput = document.getElementById('search-input');
const playPauseBtn = document.getElementById('playPauseBtn');
const playIcon = document.getElementById('playIcon');
const muteBtn = document.getElementById('muteBtn');
const volumeIcon = document.getElementById('volumeIcon');
const fullscreenBtn = document.getElementById('fullscreenBtn');
const progressContainer = document.getElementById('progressContainer');
const progressBar = document.getElementById('progressBar');
const currentTimeElement = document.getElementById('currentTime');
const durationElement = document.getElementById('duration');
const volumeSlider = document.getElementById('volumeSlider');
const volumeLevel = document.getElementById('volumeLevel');
const volumeToggleBtn = document.getElementById('volumeToggleBtn');
const volumeToggleIcon = document.getElementById('volumeToggleIcon');
const closePlayerBtn = document.getElementById('closePlayer');
const playerChannelLogo = document.getElementById('playerChannelLogo');
const playerChannelName = document.getElementById('playerChannelName');
const playerChannelGroup = document.getElementById('playerChannelGroup');
const errorMessage = document.getElementById('errorMessage');
const bufferingIndicator = document.getElementById('bufferingIndicator');
const qualitySelector = document.getElementById('qualitySelector');

function loadChannels() {
  try {
    allChannels = channelsData;
    createFilterButtons();
    displayChannels(allChannels);
    setupRemoteNavigation();
    
    searchInput.addEventListener('input', function(e) {
      const searchTerm = e.target.value.toLowerCase();
      const filteredChannels = allChannels.filter(channel => 
        channel.name.toLowerCase().includes(searchTerm) || 
        channel.group.toLowerCase().includes(searchTerm)
      );
      displayChannels(filteredChannels);
      setupRemoteNavigation();
    });

  } catch (e) {
    document.getElementById("loading").innerHTML = "❌ فشل تحميل القنوات";
  }
} 

function createFilterButtons() {
  const filterContainer = document.getElementById("filter-buttons");
  filterContainer.innerHTML = '';
  
  const categories = [...new Set(allChannels.map(ch => ch.category))];
  
  const allButton = document.createElement("button");
  allButton.className = "filter-btn active";
  allButton.textContent = "الكل";
  allButton.onclick = () => filterChannels("all");
  filterContainer.appendChild(allButton);
  
  categories.forEach(category => {
    const button = document.createElement("button");
    button.className = "filter-btn";
    button.textContent = category;
    button.onclick = () => filterChannels(category);
    filterContainer.appendChild(button);
  });
  
  filterButtons = Array.from(document.querySelectorAll('.filter-btn'));
}

function filterChannels(category) {
  currentFilter = category;
  
  filterButtons.forEach(btn => {
    btn.classList.remove('active');
  });
  
  event.target.classList.add('active');
  
  const filteredChannels = category === "all" 
    ? allChannels 
    : allChannels.filter(ch => ch.category === category);
  
  displayChannels(filteredChannels);
  setupRemoteNavigation();
}

function displayChannels(channels) {
  const grid = document.getElementById("channels");
  grid.innerHTML = "";

  if (channels.length === 0) {
    grid.innerHTML = '<div class="no-results">لم يتم العثور على قنوات</div>';
    return;
  }

  const groupedChannels = {};
  channels.forEach(ch => {
    if (!groupedChannels[ch.group]) {
      groupedChannels[ch.group] = [];
    }
    groupedChannels[ch.group].push(ch);
  });

  for (const group in groupedChannels) {
    const groupHeader = document.createElement("div");
    groupHeader.className = "group-header";
    
    // إضافة وصف خاص للمجموعات المميزة
    if (group === "سيرفر شركة ايرثلنك") {
      groupHeader.innerHTML = `
        <div>${group}</div>
        <div class="group-description">سيرفر خاص لمشتركين ايرثلنك 🔴</div>
      `;
      groupHeader.classList.add("special-group");
    } else {
      groupHeader.textContent = group;
    }
    
    grid.appendChild(groupHeader);
    
    groupedChannels[group].forEach(ch => {
      const card = document.createElement("div");
      card.className = "channel-card";
      card.tabIndex = 0;
      
      card.innerHTML = `
        <img src="${ch.logo}" alt="${ch.name}" class="channel-logo">
        <div class="quality-badge">${ch.quality}</div>
        <div class="live-badge">LIVE</div>
        <div class="channel-name">${ch.name}</div>
      `;
      
      if (ch.url && ch.url.trim() !== "") {
        card.onclick = () => playChannel(ch);
      } else {
        card.style.opacity = "0.6";
        card.style.cursor = "not-allowed";
      }
      
      grid.appendChild(card);
    });
  }

  document.getElementById("loading").style.display = "none";
} 

// وظائف المشغل
function playChannel(channel) {
  currentChannel = channel;
  
  // تحديث معلومات القناة في المشغل
  playerChannelLogo.src = channel.logo;
  playerChannelName.textContent = channel.name;
  playerChannelGroup.textContent = channel.group;
  
  // إظهار المشغل
  videoPlayerContainer.classList.add('active');
  
  // تشغيل الفيديو
  loadVideo(channel.url);
}

function loadVideo(url) {
  // إخفاء رسالة الخطأ
  errorMessage.style.display = 'none';
  
  // إظهار مؤشر التحميل
  bufferingIndicator.style.display = 'block';
  
  // إيقاف أي تشغيل سابق
  if (hls) {
    hls.destroy();
  }
  
  // إعادة تعيين الفيديو
  videoElement.pause();
  videoElement.currentTime = 0;
  progressBar.style.width = '0%';
  currentTimeElement.textContent = '00:00';
  
  // التحقق مما إذا كان المتصفح يدعم HLS بشكل طبيعي
  if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
    // المتصفح يدعم HLS بشكل طبيعي (Safari)
    videoElement.src = url;
    videoElement.play();
    isPlaying = true;
    playIcon.textContent = '⏸️';
  } else if (Hls.isSupported()) {
    // استخدام مكتبة Hls.js لمتصفحات أخرى
    hls = new Hls({
      enableWorker: true,
      lowLatencyMode: true,
      backBufferLength: 90
    });
    
    hls.loadSource(url);
    hls.attachMedia(videoElement);
    hls.on(Hls.Events.MANIFEST_PARSED, function() {
      videoElement.play();
      isPlaying = true;
      playIcon.textContent = '⏸️';
    });
    
    hls.on(Hls.Events.ERROR, function(event, data) {
      console.error('HLS error:', data);
      if (data.fatal) {
        showErrorMessage();
      }
    });
    
    hls.on(Hls.Events.BUFFER_CREATED, function() {
      bufferingIndicator.style.display = 'none';
    });
  } else {
    showErrorMessage();
    return;
  }
  
  // إعداد مستمعي الأحداث
  setupVideoEvents();
}

function setupVideoEvents() {
  // حدث التحديث الزمني
  videoElement.addEventListener('timeupdate', updateProgress);
  
  // حدث انتهاء التحميل
  videoElement.addEventListener('loadedmetadata', function() {
    durationElement.textContent = formatTime(videoElement.duration);
    bufferingIndicator.style.display = 'none';
  });
  
  // حدث بدء التحميل
  videoElement.addEventListener('waiting', function() {
    bufferingIndicator.style.display = 'block';
  });
  
  // حدث استئناف التشغيل
  videoElement.addEventListener('playing', function() {
    bufferingIndicator.style.display = 'none';
  });
  
  // حدث الخطأ
  videoElement.addEventListener('error', function() {
    showErrorMessage();
  });
}

function updateProgress() {
  if (videoElement.duration) {
    const percent = (videoElement.currentTime / videoElement.duration) * 100;
    progressBar.style.width = percent + '%';
    currentTimeElement.textContent = formatTime(videoElement.currentTime);
  }
}

function formatTime(seconds) {
  const mins = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);
  return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
}

function showErrorMessage() {
  errorMessage.style.display = 'block';
  bufferingIndicator.style.display = 'none';
}

function togglePlayPause() {
  if (videoElement.paused) {
    videoElement.play();
    isPlaying = true;
    playIcon.textContent = '⏸️';
  } else {
    videoElement.pause();
    isPlaying = false;
    playIcon.textContent = '▶️';
  }
}

function toggleMute() {
  isMuted = !isMuted;
  videoElement.muted = isMuted;
  
  if (isMuted) {
    volumeIcon.textContent = '🔇';
    volumeToggleIcon.textContent = '🔇';
  } else {
    videoElement.volume = currentVolume;
    updateVolumeIcon();
  }
}

function updateVolumeIcon() {
  if (currentVolume === 0 || isMuted) {
    volumeIcon.textContent = '🔇';
    volumeToggleIcon.textContent = '🔇';
  } else if (currentVolume < 0.5) {
    volumeIcon.textContent = '🔉';
    volumeToggleIcon.textContent = '🔉';
  } else {
    volumeIcon.textContent = '🔊';
    volumeToggleIcon.textContent = '🔊';
  }
}

function setVolume(value) {
  currentVolume = value;
  videoElement.volume = currentVolume;
  volumeLevel.style.width = (currentVolume * 100) + '%';
  
  if (currentVolume === 0) {
    isMuted = true;
    videoElement.muted = true;
  } else {
    isMuted = false;
    videoElement.muted = false;
  }
  
  updateVolumeIcon();
}

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    videoPlayerContainer.requestFullscreen().catch(err => {
      console.error(`Error attempting to enable fullscreen: ${err.message}`);
    });
  } else {
    document.exitFullscreen();
  }
}

function seekVideo(e) {
  const rect = progressContainer.getBoundingClientRect();
  const percent = (e.clientX - rect.left) / rect.width;
  videoElement.currentTime = percent * videoElement.duration;
}

function setupPlayerControls() {
  // زر التشغيل/الإيقاف المؤقت
  playPauseBtn.addEventListener('click', togglePlayPause);
  
  // زر كتم الصوت
  muteBtn.addEventListener('click', toggleMute);
  
  // زر الشاشة الكاملة
  fullscreenBtn.addEventListener('click', toggleFullscreen);
  
  // شريط التقدم
  progressContainer.addEventListener('click', seekVideo);
  
  // التحكم في مستوى الصوت
  volumeSlider.addEventListener('click', function(e) {
    const rect = volumeSlider.getBoundingClientRect();
    const percent = (e.clientX - rect.left) / rect.width;
    setVolume(Math.max(0, Math.min(1, percent)));
  });
  
  // زر إغلاق المشغل
  closePlayerBtn.addEventListener('click', function() {
    videoPlayerContainer.classList.remove('active');
    if (hls) {
      hls.destroy();
    }
    videoElement.pause();
    isPlaying = false;
  });
  
  // اختيار الجودة
  qualitySelector.addEventListener('change', function() {
    if (hls) {
      const selectedQuality = this.value;
      if (selectedQuality === 'auto') {
        hls.currentLevel = -1; // التلقائي
      } else {
        const levels = hls.levels;
        for (let i = 0; i < levels.length; i++) {
          if (levels[i].height <= parseInt(selectedQuality)) {
            hls.currentLevel = i;
            break;
          }
        }
      }
    }
  });
  
  // اختصارات لوحة المفاتيح للمشغل
  document.addEventListener('keydown', function(e) {
    if (!videoPlayerContainer.classList.contains('active')) return;
    
    e.preventDefault();
    
    switch(e.key) {
      case ' ':
      case 'Spacebar':
        togglePlayPause();
        break;
      case 'ArrowLeft':
        videoElement.currentTime = Math.max(0, videoElement.currentTime - 10);
        break;
      case 'ArrowRight':
        videoElement.currentTime = Math.min(videoElement.duration, videoElement.currentTime + 10);
        break;
      case 'ArrowUp':
        setVolume(Math.min(1, currentVolume + 0.1));
        break;
      case 'ArrowDown':
        setVolume(Math.max(0, currentVolume - 0.1));
        break;
      case 'f':
      case 'F':
        toggleFullscreen();
        break;
      case 'm':
      case 'M':
        toggleMute();
        break;
      case 'Escape':
        videoPlayerContainer.classList.remove('active');
        if (hls) {
          hls.destroy();
        }
        videoElement.pause();
        isPlaying = false;
        break;
    }
  });
}

// التحكم عن بعد
function setupRemoteNavigation() {
  channelCards = Array.from(document.querySelectorAll('.channel-card'));
  filterButtons = Array.from(document.querySelectorAll('.filter-btn'));
  currentFocusIndex = 0;
  
  // Clear all focus
  searchInput.classList.remove('focused');
  filterButtons.forEach(btn => btn.classList.remove('focused'));
  channelCards.forEach(card => card.classList.remove('focused'));
  
  if (channelCards.length > 0) {
    channelCards[currentFocusIndex].classList.add('focused');
    channelCards[currentFocusIndex].focus();
  }
  
  // Keyboard navigation
  document.addEventListener('keydown', function(e) {
    // إذا كان المشغل مفتوحاً، تخطي التنقل بين القنوات
    if (videoPlayerContainer.classList.contains('active')) return;
    
    switch(e.key) {
      case 'ArrowUp':
        e.preventDefault();
        navigateRemote('up');
        break;
      case 'ArrowDown':
        e.preventDefault();
        navigateRemote('down');
        break;
      case 'ArrowLeft':
        e.preventDefault();
        navigateRemote('left');
        break;
      case 'ArrowRight':
        e.preventDefault();
        navigateRemote('right');
        break;
      case 'Enter':
        e.preventDefault();
        activateCurrent();
        break;
    }
  });
}

function navigateRemote(direction) {
  if (channelCards.length === 0) return;
  
  const oldIndex = currentFocusIndex;
  let newIndex = currentFocusIndex;
  const columns = 3;
  
  switch(direction) {
    case 'up':
      newIndex = Math.max(0, currentFocusIndex - columns);
      break;
    case 'down':
      newIndex = Math.min(channelCards.length - 1, currentFocusIndex + columns);
      break;
    case 'left':
      newIndex = Math.max(0, currentFocusIndex - 1);
      break;
    case 'right':
      newIndex = Math.min(channelCards.length - 1, currentFocusIndex + 1);
      break;
  }
  
  if (newIndex !== oldIndex) {
    channelCards[oldIndex].classList.remove('focused');
    channelCards[newIndex].classList.add('focused');
    channelCards[newIndex].focus();
    currentFocusIndex = newIndex;
    
    // Scroll into view
    channelCards[newIndex].scrollIntoView({
      behavior: 'smooth',
      block: 'center'
    });
  }
}

function activateCurrent() {
  if (channelCards.length > 0 && channelCards[currentFocusIndex].style.cursor !== 'not-allowed') {
    channelCards[currentFocusIndex].click();
  }
}

// Simple search focus for when user wants to type
searchInput.addEventListener('focus', () => {
  // Clear channel focus when searching
  channelCards.forEach(card => card.classList.remove('focused'));
});

// تهيئة المشغل عند تحميل الصفحة
window.addEventListener('DOMContentLoaded', function() {
  loadChannels();
  setupPlayerControls();
  setVolume(0.8); // تعيين مستوى الصوت الافتراضي
  
  // إخفاء المشغل عند النقر خارج نطاقه
  videoPlayerContainer.addEventListener('click', function(e) {
    if (e.target === this) {
      this.classList.remove('active');
      if (hls) {
        hls.destroy();
      }
      videoElement.pause();
      isPlaying = false;
    }
  });
});
