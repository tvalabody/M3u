<style>
:root {
  --primary: #4361ee;
  --accent: #f72585;
  --glass-bg: rgba(255, 255, 255, 0.1);
  --glass-border: rgba(255, 255, 255, 0.15);
  --blur: blur(15px);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Cairo', sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: 
    radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
    radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.3) 0%, transparent 50%);
  z-index: -1;
}

.container {
  display: flex;
  flex-direction: column;
  height: 100vh;
}

.player-section {
  height: 45vh;
  width: 100%;
  background: #000;
  position: relative;
  border-bottom: 2px solid rgba(255, 255, 255, 0.1);
}

#player {
  width: 100%;
  height: 100%;
}

.channels-section {
  flex: 1;
  overflow-y: auto;
  padding: 15px;
}

.glass-panel {
  background: var(--glass-bg);
  backdrop-filter: var(--blur);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
}

.header {
  text-align: center;
  padding: 15px;
  margin-bottom: 10px;
}

.header h1 {
  font-size: 1.8rem;
  background: linear-gradient(135deg, #fff 0%, #e2e8ff 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  margin-bottom: 5px;
}

.subtitle {
  color: rgba(255, 255, 255, 0.8);
  font-size: 0.8rem;
}

.telegram-link {
  margin-top: 8px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(0, 136, 204, 0.2);
  padding: 6px 12px;
  border-radius: 10px;
  color: white;
  text-decoration: none;
  font-weight: 600;
  transition: all 0.3s ease;
}

.telegram-link:hover {
  background: rgba(0, 136, 204, 0.3);
  transform: translateY(-2px);
}

.search-section {
  margin-bottom: 10px;
  padding: 10px;
}

.search-box {
  width: 100%;
  padding: 10px 15px;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 10px;
  font-family: 'Cairo', sans-serif;
  font-size: 13px;
  color: white;
  outline: none;
  transition: all 0.3s ease;
}

.search-box::placeholder {
  color: rgba(255, 255, 255, 0.6);
}

.search-box.focused {
  background: rgba(255, 255, 255, 0.15);
  border: 2px solid rgba(67, 97, 238, 0.6);
  box-shadow: 0 0 15px rgba(67, 97, 238, 0.3);
}

.filter-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 10px;
  justify-content: center;
  padding: 0 5px;
}

.filter-btn {
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.15);
  color: rgba(255, 255, 255, 0.9);
  padding: 6px 12px;
  border-radius: 10px;
  cursor: pointer;
  font-family: 'Cairo', sans-serif;
  font-weight: 600;
  font-size: 0.75rem;
  transition: all 0.3s ease;
}

.filter-btn.active, .filter-btn.focused {
  background: rgba(67, 97, 238, 0.3);
  border-color: rgba(67, 97, 238, 0.6);
  box-shadow: 0 0 10px rgba(67, 97, 238, 0.3);
}

.channels-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  padding: 10px;
}

.channel-card {
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 10px;
  padding: 10px;
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
  min-height: 100px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.channel-card:hover {
  background: rgba(255, 255, 255, 0.12);
  border-color: rgba(255, 255, 255, 0.2);
  transform: translateY(-2px);
}

.channel-card.focused {
  background: rgba(67, 97, 238, 0.2);
  border: 2px solid rgba(67, 97, 238, 0.6);
  transform: scale(1.05);
  box-shadow: 0 0 20px rgba(67, 97, 238, 0.4);
}

.channel-logo {
  width: 40px;
  height: 40px;
  object-fit: contain;
  border-radius: 6px;
  margin-bottom: 6px;
}

.channel-name {
  font-weight: 600;
  color: white;
  font-size: 0.8rem;
  text-align: center;
  margin-bottom: 4px;
  line-height: 1.2;
}

.quality-badge {
  position: absolute;
  top: 6px;
  left: 6px;
  background: rgba(67, 97, 238, 0.8);
  color: white;
  padding: 2px 5px;
  border-radius: 5px;
  font-size: 0.55rem;
  font-weight: 600;
}

.live-badge {
  position: absolute;
  top: 6px;
  right: 6px;
  background: rgba(247, 37, 133, 0.8);
  color: white;
  padding: 2px 5px;
  border-radius: 5px;
  font-size: 0.55rem;
  font-weight: 600;
}

.group-header {
  grid-column: 1 / -1;
  font-size: 1rem;
  font-weight: 700;
  margin: 15px 0 8px;
  padding-bottom: 6px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.2);
  color: white;
}

.loading {
  text-align: center;
  padding: 30px 20px;
  color: white;
  grid-column: 1 / -1;
}

.spinner {
  width: 25px;
  height: 25px;
  border: 3px solid rgba(255, 255, 255, 0.3);
  border-top: 3px solid white;
  border-radius: 50%;
  margin: 0 auto 10px;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.no-results {
  text-align: center;
  padding: 20px;
  color: rgba(255, 255, 255, 0.6);
  grid-column: 1 / -1;
}

.remote-controls {
  position: fixed;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  display: none;
  gap: 8px;
  background: rgba(0, 0, 0, 0.7);
  padding: 12px;
  border-radius: 16px;
  backdrop-filter: blur(10px);
  z-index: 1000;
}

.remote-btn {
  width: 45px;
  height: 45px;
  background: rgba(255, 255, 255, 0.2);
  border: none;
  border-radius: 10px;
  color: white;
  font-size: 1rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
}

.remote-btn:active {
  background: rgba(255, 255, 255, 0.3);
  transform: scale(0.95);
}

@media (max-width: 768px) {
  .channels-grid {
    grid-template-columns: repeat(2, 1fr);
  }
  
  .player-section {
    height: 40vh;
  }
}

@media (max-width: 480px) {
  .channels-grid {
    grid-template-columns: 1fr;
  }
  
  .player-section {
    height: 35vh;
  }
}

@media (min-width: 1024px) {
  .remote-controls {
    display: flex;
  }
}
</style>
</head>

// متغيرات النظام
let allChannels = [];
let currentFilter = "all";
let currentFocusIndex = 0;
let channelCards = [];
let filterButtons = [];
let playerInstance = null;
const searchInput = document.getElementById('search-input');

// تهيئة المشغل
function initPlayer(url) {
  if (playerInstance) {
    playerInstance.destroy();
  }
  
  playerInstance = new Clappr.Player({
    source: url,
    autoPlay: true,
    height: "100%",
    width: "100%",
    parentId: "#player",
    mimeType: "application/x-mpegURL",
    playback: {
      playInline: true,
      recycleVideo: Clappr.Options.NOOP
    },
    plugins: [],
    clapprSettings: {
      preload: 'auto'
    }
  });
}

// تحميل القنوات
function loadChannels() {
  try {
    allChannels = channelsData;
    createFilterButtons();
    displayChannels(allChannels);
    setupRemoteNavigation();
    
    // بدء المشغل بالقناة الأولى
    if (allChannels.length > 0 && allChannels[0].url) {
      initPlayer(allChannels[0].url);
    }
    
    searchInput.addEventListener('input', function(e) {
      const searchTerm = e.target.value.toLowerCase();
      const filteredChannels = allChannels.filter(channel => 
        channel.name.toLowerCase().includes(searchTerm) || 
        channel.group.toLowerCase().includes(searchTerm)
      );
      displayChannels(filteredChannels);
      setupRemoteNavigation();
    });

  } catch (e) {
    document.getElementById("loading").innerHTML = "❌ فشل تحميل القنوات";
  }
} 

// إنشاء أزرار التصفية
function createFilterButtons() {
  const filterContainer = document.getElementById("filter-buttons");
  filterContainer.innerHTML = '';
  
  const categories = [...new Set(allChannels.map(ch => ch.category))];
  
  const allButton = document.createElement("button");
  allButton.className = "filter-btn active";
  allButton.textContent = "الكل";
  allButton.onclick = () => filterChannels("all");
  filterContainer.appendChild(allButton);
  
  categories.forEach(category => {
    const button = document.createElement("button");
    button.className = "filter-btn";
    button.textContent = category;
    button.onclick = () => filterChannels(category);
    filterContainer.appendChild(button);
  });
  
  filterButtons = Array.from(document.querySelectorAll('.filter-btn'));
}

// تصفية القنوات
function filterChannels(category) {
  currentFilter = category;
  
  filterButtons.forEach(btn => {
    btn.classList.remove('active');
  });
  
  event.target.classList.add('active');
  
  const filteredChannels = category === "all" 
    ? allChannels 
    : allChannels.filter(ch => ch.category === category);
  
  displayChannels(filteredChannels);
  setupRemoteNavigation();
}

// عرض القنوات
function displayChannels(channels) {
  const grid = document.getElementById("channels");
  grid.innerHTML = "";

  if (channels.length === 0) {
    grid.innerHTML = '<div class="no-results">لم يتم العثور على قنوات</div>';
    return;
  }

  const groupedChannels = {};
  channels.forEach(ch => {
    if (!groupedChannels[ch.group]) {
      groupedChannels[ch.group] = [];
    }
    groupedChannels[ch.group].push(ch);
  });

  for (const group in groupedChannels) {
    const groupHeader = document.createElement("div");
    groupHeader.className = "group-header";
    groupHeader.textContent = group;
    grid.appendChild(groupHeader);
    
    groupedChannels[group].forEach(ch => {
      const card = document.createElement("div");
      card.className = "channel-card";
      card.tabIndex = 0;
      card.dataset.url = ch.url;
      
      card.innerHTML = `
        <img src="${ch.logo}" alt="${ch.name}" class="channel-logo" onerror="this.src='https://via.placeholder.com/300x200/333/fff?text=TV'">
        <div class="quality-badge">${ch.quality}</div>
        <div class="live-badge">LIVE</div>
        <div class="channel-name">${ch.name}</div>
      `;
      
      card.onclick = function() {
        if (ch.url && ch.url.trim() !== "") {
          initPlayer(ch.url);
          // إضافة تأثير للمؤشر
          channelCards.forEach(c => c.classList.remove('focused'));
          this.classList.add('focused');
          currentFocusIndex = channelCards.indexOf(this);
        }
      };
      
      grid.appendChild(card);
    });
  }

  document.getElementById("loading").style.display = "none";
} 

// إعداد التحكم عن بعد
function setupRemoteNavigation() {
  channelCards = Array.from(document.querySelectorAll('.channel-card'));
  filterButtons = Array.from(document.querySelectorAll('.filter-btn'));
  currentFocusIndex = 0;
  
  searchInput.classList.remove('focused');
  filterButtons.forEach(btn => btn.classList.remove('focused'));
  channelCards.forEach(card => card.classList.remove('focused'));
  
  if (channelCards.length > 0) {
    channelCards[currentFocusIndex].classList.add('focused');
    channelCards[currentFocusIndex].focus();
  }
  
  document.addEventListener('keydown', function(e) {
    switch(e.key) {
      case 'ArrowUp':
        e.preventDefault();
        navigateRemote('up');
        break;
      case 'ArrowDown':
        e.preventDefault();
        navigateRemote('down');
        break;
      case 'ArrowLeft':
        e.preventDefault();
        navigateRemote('left');
        break;
      case 'ArrowRight':
        e.preventDefault();
        navigateRemote('right');
        break;
      case 'Enter':
        e.preventDefault();
        activateCurrent();
        break;
    }
  });
}

// التنقل عن بعد
function navigateRemote(direction) {
  if (channelCards.length === 0) return;
  
  const oldIndex = currentFocusIndex;
  let newIndex = currentFocusIndex;
  const columns = 3;
  
  switch(direction) {
    case 'up':
      newIndex = Math.max(0, currentFocusIndex - columns);
      break;
    case 'down':
      newIndex = Math.min(channelCards.length - 1, currentFocusIndex + columns);
      break;
    case 'left':
      newIndex = Math.max(0, currentFocusIndex - 1);
      break;
    case 'right':
      newIndex = Math.min(channelCards.length - 1, currentFocusIndex + 1);
      break;
  }
  
  if (newIndex !== oldIndex) {
    channelCards[oldIndex].classList.remove('focused');
    channelCards[newIndex].classList.add('focused');
    channelCards[newIndex].focus();
    currentFocusIndex = newIndex;
    
    channelCards[newIndex].scrollIntoView({
      behavior: 'smooth',
      block: 'center'
    });
  }
}

// تفعيل القناة الحالية
function activateCurrent() {
  if (channelCards.length > 0 && channelCards[currentFocusIndex].dataset.url) {
    const url = channelCards[currentFocusIndex].dataset.url;
    if (url && url.trim() !== "") {
      initPlayer(url);
    }
  }
}

// التركيز على البحث
searchInput.addEventListener('focus', () => {
  channelCards.forEach(card => card.classList.remove('focused'));
});

// تحميل النظام
window.onload = loadChannels;
